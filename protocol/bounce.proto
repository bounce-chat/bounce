syntax = "proto3";
option go_package = "github.com/hkparker/bounce/protocol";

//
// Messages that can be sent in chats
//

message ChatMessage {
	string id = 1;
	string source = 2;
	string destinationThread = 3;			// Group UUID or DM.  DMs are groups of only two?  this is a thread UUID
	string text = 4;
	repeated bytes images = 5; // Should be a preview to a future image
	bytes audio = 6;
	bytes video = 7;
	bytes file = 8;
}

message SignedChatMessage {
	bytes MarshalledChatMessage = 1;
	bytes Signature = 2;			//sig(SHA3(message))
}

// A list of UUIDs this device knows about to share with other devices
message References {
	repeated string signedChatMessages = 1;
}

//
// Device and DeviceGroup management
//

message Device {
	string NetworkAddress = 1;
}

message AddDeviceToDeviceGroup {
	string id = 1;
	MutualDeviceSignature signature = 2;
}

message MutualDeviceSignature {
	Device deviceOne = 1;
	Device deviceTwo = 2;
	bytes deviceOneSignatureOfDeviceTwo = 3;
	bytes deviceTwoSignatureOfDeviceOne = 4;
}

message DeviceGroupIntroduction {
	string id = 1;
	string name = 2;
	bytes image = 3;
	repeated MutualDeviceSignature signatureSet = 4;
	Device metadataSigningDevice = 5;
}

//
// Managing chat groups
//

// You've been invited to join a group
message GroupInvite {
	string id = 1;
	string name = 2;
	bytes image = 3;
	repeated DeviceGroupIntroduction deviceGroupIntroductions = 4;
}

//
// Messages only sent to other devices you own
//

message UpdateNotificationSettings {
	string groupID = 1;
	bool notify = 2;
}
